plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.disco'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
        }
    }
}
